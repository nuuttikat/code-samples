name: Tests

on:
  push:
  pull_request:

# Read-only token: the tests never need to write to the repository.
permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: php invoice-reference/test.php
      - run: php money-and-dates/test.php

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample: [react-cart, express-auth]
    defaults:
      run:
        working-directory: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test

  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-mobile-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
